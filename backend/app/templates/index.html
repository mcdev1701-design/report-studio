<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <title>Report Studio</title>

    <link rel="stylesheet" href="static/css/style.css" />
</head>

<body>

    <div id="app">

        <h1>Report Studio</h1>

        <div id="designer-layout">

            <section id="toolbox-panel">

                <h2>Toolbox</h2>

                <button class="tool-button"
                        data-tool="text">
                    Text
                </button>

                <button class="tool-button"
                        data-tool="field">
                    Field
                </button>

                <button class="tool-button"
                        data-tool="image">
                    Image
                </button>

                <button class="tool-button"
                        data-tool="chart">
                    Chart
                </button>

            </section>

            <section id="canvas-panel">

                <h2>Canvas</h2>

                <div id="canvas-placeholder">

                    Obszar roboczy projektanta raportów

                </div>

            </section>

            <section id="property-panel">

                <h2>Properties</h2>

                <div id="property-placeholder">

                    Brak zaznaczonego obiektu

                </div>

            </section>

        </div>

        <section id="system-status-panel">

            <h2>System Status</h2>

            <div id="backend-info">
                Oczekiwanie na dane z backendu...
            </div>

        </section>

        <section id="shortcuts-panel">

            Skróty klawiaturowe:
            <div id="shortcuts-content">
                Czekaj..
            </div>

        </section>

    </div>


    <script src="static/js/app.js"></script>

</body>

</html>
