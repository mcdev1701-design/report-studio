<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <title>Report Studio</title>

    <link rel="stylesheet" href="static/css/style.css" />
</head>

<body>

    <div id="app">

        <h1>Report Studio</h1>

        <section id="system-status-panel">

            <h2>System Status</h2>

            <div id="backend-info">
                Oczekiwanie na dane z backendu...
            </div>

        </section>

        <section id="toolbox-panel">

            <h2>Toolbox</h2>

            <button class="tool-button">
                Text
            </button>

            <button class="tool-button">
                Field
            </button>

            <button class="tool-button">
                Image
            </button>

            <button class="tool-button">
                Chart
            </button>

        </section>

        <section id="canvas-panel">

            <h2>Canvas</h2>

            <div id="canvas-placeholder">

                Obszar roboczy projektanta raportów

            </div>

        </section>

    </div>


    <script src="static/js/app.js"></script>

</body>

</html>
